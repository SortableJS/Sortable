<!doctype html><meta charset="utf-8"><title>Preserve styled sortable cards</title>
<style>body{font:18px sans-serif;margin:40px} #list{width:400px;margin:40px;padding:20px;background:#eee} .card{box-sizing:border-box;width:300px;height:65px;margin:25px;padding:20px;background:#e1eef9;border:2px solid #345;cursor:grab}button{font:inherit;padding:10px}.class-style{transform:rotate(-4deg) scale(.9);transition:opacity .2s}</style>
<h1>Preserve styled sortable cards</h1><button id="reverse">Reverse order</button><div id="list"><div class="card" data-id="a" style="transform:rotate(5deg) scale(.9);transition:opacity .2s">Alpha</div><div class="card class-style" data-id="b">Bravo</div><div class="card" data-id="c" style="transform:translateX(14px) scale(.95);transition:opacity .3s">Charlie</div></div>
<script>
const params=new URLSearchParams(location.search),script=document.createElement('script');script.src='../Sortable.js';script.onload=()=>{window.sortable=Sortable.create(document.querySelector('#list'),{animation:300,forceFallback:params.get('native')!=='true',fallbackOnBody:true,onEnd:()=>window.ended=true});document.querySelector('#reverse').onclick=()=>sortable.sort(sortable.toArray().reverse(),true);window.initialStyles=Array.from(document.querySelectorAll(".card"),n=>({id:n.dataset.id,transform:n.style.transform,transition:n.style.transition,matrix:getComputedStyle(n).transform}));window.ready=true};document.head.appendChild(script);
</script>
